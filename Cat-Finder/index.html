<!DOCTYPE html>
<html>
<head>
    <title>Cat Finder</title>
    <style>
        body{
            text-align:center;
            font-family:Arial,sans-serif;
            margin-top:50px;
        }
        img{
            width:300px;
            height:300px;
            object-fit:cover;
            border-radius:15px;
            margin-top:20px;
        }
        button{
            padding:10px 20px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<h1>Random Cat Finder</h1>

<button onclick="fetchCat()">Get Cat</button>
<p id="message">Click the button to find a cat!</p>

<div>
    <img id="catImg" src="" alt="">
</div>

<script>
async function fetchCat() {

    const message = document.getElementById("message");

    message.textContent = "Loading...";

    try {
        const response = await fetch(
            "https://api.thecatapi.com/v1/images/search"
        );

        const data = await response.json();

        document.getElementById("catImg").src = data[0].url;
        message.textContent = "Here is your random cat!";

    } catch(error) {
        console.log(error);
        message.textContent = "Error fetching cat. Please try again.";
    }
}
</script>

</body>
</html>
