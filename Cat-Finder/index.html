<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cat Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f6d5f7, #fbe9d7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .image-container {
            width: 100%;
            height: 320px;
            background-color: #f5f5f5;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        #catImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder {
            color: #999;
            font-size: 16px;
            padding: 20px;
        }

        #message {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
            min-height: 20px;
        }

        button {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #574fd6;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(108, 99, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        footer {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .image-container {
                height: 280px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🐱</div>

        <h1>Random Cat Finder</h1>

        <p class="subtitle">
            Discover a cute random cat with just one click!
        </p>

        <div class="image-container">

            <div class="placeholder" id="placeholder">
                Your cat will appear here 🐾
            </div>

            <img id="catImg" src="" alt="Random cat">

        </div>

        <p id="message">
            Click the button to find a cat!
        </p>

        <button onclick="fetchCat()">
            🐱 Get Another Cat
        </button>

        <footer>
            Powered by The Cat API
        </footer>

    </div>

    <script>

        async function fetchCat() {

            const message = document.getElementById("message");
            const catImg = document.getElementById("catImg");
            const placeholder = document.getElementById("placeholder");

            message.textContent = "Finding a cute cat... 🐾";

            catImg.style.display = "none";
            placeholder.style.display = "block";

            try {

                const response = await fetch(
                    "https://api.thecatapi.com/v1/images/search"
                );

                if (!response.ok) {
                    throw new Error("Unable to fetch cat image");
                }

                const data = await response.json();

                catImg.src = data[0].url;

                catImg.onload = function () {
                    placeholder.style.display = "none";
                    catImg.style.display = "block";
                };

                message.textContent = "Here is your random cat! 🐱";

            } catch (error) {

                message.textContent =
                    "Oops! Something went wrong. Please try again.";

                console.log(error);
            }
        }

    </script>

</body>

</html>
